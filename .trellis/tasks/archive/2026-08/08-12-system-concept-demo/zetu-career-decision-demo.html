<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>择途 · 职业研究系统 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #fff;
      --panel-soft: #f2f4f7;
      --ink: #242a33;
      --muted: #78818d;
      --line: #e2e6eb;
      --line-dark: #cbd2da;
      --green: #1b9a70;
      --green-soft: #e5f5ee;
      --orange: #e8683d;
      --orange-soft: #fff0ea;
      --red: #dc4c4c;
      --red-soft: #fff0f0;
      --blue: #3d79bf;
      --blue-soft: #edf5ff;
      --navy: #202938;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
      --serif: "Noto Serif CJK SC", "Songti SC", Georgia, serif;
      font-family: var(--sans);
      font-size: 16px;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
    body { overflow: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .app { height: 100vh; display: grid; grid-template-rows: 54px minmax(0, 1fr); }
    .topbar { display: grid; grid-template-columns: 170px minmax(260px, 1fr) 300px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
    .brand { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 18px; border-right: 1px solid var(--line); }
    .brand-mark { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 5px; background: var(--navy); color: white; font-family: var(--serif); font-weight: 700; }
    .brand strong { display: block; font-size: 14px; letter-spacing: .02em; }
    .brand small { display: block; margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 8px; }
    .journey-nav { display: flex; justify-content: center; align-self: stretch; }
    .journey-button { position: relative; min-width: 126px; padding: 0 18px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; }
    .journey-button:first-child { border-left: 1px solid var(--line); }
    .journey-button::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
    .journey-button:hover { background: var(--panel-soft); color: var(--ink); }
    .journey-button.active { background: #fbfcfd; color: var(--ink); }
    .journey-button.active::after { background: var(--orange); }
    .journey-button small { display: block; margin-bottom: 2px; font-family: var(--mono); font-size: 8px; }
    .journey-button strong { display: block; font-size: 10px; }
    .journey-button.done small { color: var(--green); }
    .mode-nav { display: flex; justify-content: flex-end; gap: 2px; }
    .mode-button { min-width: 70px; height: 32px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; }
    .mode-button:hover { background: var(--panel-soft); color: var(--ink); }
    .mode-button.active { background: var(--panel-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .stage-meta { display: flex; justify-content: flex-end; align-items: center; gap: 9px; height: 100%; padding: 0 17px; border-left: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .stage-meta strong { color: var(--ink); font-family: var(--sans); font-size: 12px; }
    .stage-meta.research-controls { gap: 6px; }
    .stage-meta.research-controls .concept-badge { margin-right: 5px; }
    .concept-badge { padding: 3px 6px; border: 1px solid var(--line-dark); border-radius: 4px; color: var(--muted); font-family: var(--mono); font-size: 8px; text-transform: uppercase; }
    .ready { display: inline-flex; align-items: center; gap: 5px; color: #5a6571; }
    .ready::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .ready.waiting::before { background: var(--line-dark); }
    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(390px, .8fr) minmax(520px, 1.05fr); }
    .workspace.artifact { grid-template-columns: 1fr 0; }
    .workspace.artifact .task-pane { display: none; }
    .workspace.workbench { grid-template-columns: 0 minmax(430px, 1fr); }
    .workspace.workbench .artifact-pane { display: none; }
    .artifact-pane, .task-pane { min-width: 0; min-height: 0; overflow: hidden; }
    .artifact-pane { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-right: 1px solid var(--line); background: var(--panel); }
    .workspace.workbench .task-pane { grid-column: 2; }
    .task-pane { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: var(--panel); }
    .task-head { display: flex; justify-content: space-between; gap: 18px; padding: 18px 22px 13px; border-bottom: 1px solid var(--line); }
    .task-head h1 { margin: 0; font-size: 17px; line-height: 1.35; }
    .task-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .task-head > div:last-child { display: grid; justify-items: end; align-content: start; gap: 7px; color: var(--muted); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    .task-head .mode-nav { font-family: var(--sans); }
    .task-head .status { padding: 4px 7px; border-radius: 4px; font-family: var(--sans); font-size: 10px; font-weight: 700; }
    .stage-rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 22px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
    .stage-rail.profile { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stage-rail.library { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stage-button { position: relative; min-width: 0; height: 45px; padding: 0 8px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); text-align: left; }
    .stage-button:first-child { border-left: 1px solid var(--line); }
    .stage-button::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
    .stage-button:hover { color: var(--ink); background: var(--panel-soft); }
    .stage-button.active { color: var(--ink); background: var(--panel); }
    .stage-button.active::after { background: var(--orange); }
    .stage-button small { display: block; margin-bottom: 2px; font-family: var(--mono); font-size: 8px; }
    .stage-button strong { display: block; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; width: fit-content; min-height: 22px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 4px; font-size: 10px; font-weight: 700; }
    .status.done { border-color: #a7d8c1; background: var(--green-soft); color: #147650; }
    .status.active { border-color: #f0bdab; background: var(--orange-soft); color: #be542f; }
    .status.wait { border-color: #b9d0ec; background: var(--blue-soft); color: #3d6d9f; }
    .status.stop { border-color: #edb8b8; background: var(--red-soft); color: #a43b3b; }
    .task-scroll { min-height: 0; overflow: auto; padding: 0 22px 20px; }
    .stage-block { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .stage-block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .stage-block-head h2 { margin: 0; font-size: 14px; }
    .stage-block-head span { color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .stage-block p { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .signal-strip { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 13px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .signal { display: flex; align-items: baseline; gap: 6px; }
    .signal strong { font-family: var(--serif); font-size: 16px; font-weight: 600; }
    .signal span { color: var(--muted); font-size: 9px; }
    .source-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) 66px; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .source-row:last-child { border-bottom: 0; }
    .source-kind { color: var(--blue); font-size: 10px; font-weight: 700; }
    .source-kind.risk { color: var(--orange); }
    .source-row strong { display: block; font-size: 11px; line-height: 1.4; }
    .source-row p { margin: 3px 0 0; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .source-row time { color: var(--muted); font-family: var(--mono); font-size: 9px; text-align: right; }
    .question { display: flex; align-items: start; gap: 9px; margin-top: 12px; padding: 11px; border: 1px solid #f0c2b0; border-radius: 5px; background: var(--orange-soft); }
    .question strong { display: block; color: #9c482d; font-size: 11px; }
    .question p { margin: 4px 0 0; color: #805c50; font-size: 10px; line-height: 1.5; }
    .question-icon { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--orange); color: white; font-family: var(--mono); font-size: 10px; }
    .progress-list { display: grid; margin-top: 16px; border-top: 1px solid var(--line); }
    .progress-row { display: grid; grid-template-columns: 9px 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: 34px; padding: 0 2px; border-bottom: 1px solid var(--line); }
    .progress-row i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-dark); }
    .progress-row.done i { background: var(--green); }
    .progress-row.active i { background: var(--orange); }
    .progress-row code { color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .progress-row strong { font-size: 10px; }
    .progress-row span:last-child { color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .action-bar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .action { min-height: 32px; padding: 0 12px; border: 1px solid var(--line-dark); border-radius: 5px; background: var(--panel); color: var(--ink); font-size: 11px; font-weight: 700; }
    .action:hover { background: var(--panel-soft); }
    .action.primary { border-color: var(--navy); background: var(--navy); color: white; }
    .activity-strip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 43px; padding: 0 22px; border-top: 1px solid var(--line); background: #fbfcfd; color: var(--muted); font-size: 9px; }
    .activity-strip strong { color: var(--ink); font-size: 10px; }
    .activity-strip p { overflow: hidden; margin: 0; text-overflow: ellipsis; white-space: nowrap; }
    .activity-strip time { font-family: var(--mono); font-size: 8px; }
    .dialogue { display: grid; gap: 9px; margin-top: 13px; }
    .bubble { max-width: 88%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-soft); color: #4e5763; font-size: 10px; line-height: 1.65; }
    .bubble.user { justify-self: end; border-color: #ccd4df; background: var(--navy); color: #f5f7fa; }
    .prompt-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .prompt { min-height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--muted); font-size: 10px; }
    .prompt:hover { border-color: var(--line-dark); color: var(--ink); }
    .context-kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .context-kicker strong { color: var(--ink); font-family: var(--sans); font-size: 12px; }
    .dossier-lead { padding: 30px 38px 22px; border-bottom: 1px solid var(--line); }
    .dossier-eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .dossier-lead h2 { max-width: 18ch; margin: 15px 0 9px; font-family: var(--serif); font-size: 29px; line-height: 1.25; font-weight: 600; }
    .dossier-deck { max-width: 58ch; margin: 0; color: #626c77; font-family: var(--serif); font-size: 12px; line-height: 1.8; }
    .dossier-meta { display: flex; flex-wrap: wrap; gap: 7px 16px; margin-top: 17px; color: var(--muted); font-size: 10px; }
    .dossier-meta strong { color: var(--ink); font-weight: 600; }
    .decision-line { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; margin-top: 21px; padding: 16px 0 0; border-top: 1px solid var(--line-dark); }
    .decision-line > span { color: var(--muted); font-size: 10px; }
    .decision-line strong { font-family: var(--serif); font-size: 17px; line-height: 1.45; font-weight: 600; }
    .context-body { min-height: 0; overflow: auto; padding: 0 38px 28px; }
    .context-section { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .context-section:last-child { border-bottom: 0; }
    .context-section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .context-section-head h3 { margin: 0; font-size: 12px; }
    .context-section-head span { color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .context-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .context-fact { min-height: 65px; padding: 11px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); }
    .context-fact strong { display: block; font-size: 11px; line-height: 1.35; }
    .context-fact span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .context-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .context-list li { display: grid; grid-template-columns: 7px minmax(0, 1fr); gap: 8px; align-items: start; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .context-list i { width: 6px; height: 6px; margin-top: 4px; border-radius: 50%; background: var(--line-dark); }
    .context-list i.good { background: var(--green); }
    .context-list i.risk { background: var(--orange); }
    .context-list strong { display: block; color: var(--ink); font-size: 10px; }
    .constraint-note { margin: 0; padding: 12px 0 0 15px; border-left: 2px solid var(--orange); color: #5c6570; font-family: var(--serif); font-size: 11px; line-height: 1.7; }
    .fact-ledger { display: grid; gap: 0; border-top: 1px solid var(--line); }
    .fact-entry { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .fact-entry > span { font-size: 9px; font-weight: 700; }
    .fact-entry.confirmed > span { color: var(--green); }
    .fact-entry.inferred > span { color: var(--blue); }
    .fact-entry.unknown > span { color: var(--orange); }
    .fact-entry strong { display: block; font-size: 11px; }
    .fact-entry p { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .upload-zone { display: grid; place-items: center; min-height: 150px; margin-top: 14px; padding: 22px; border: 1px dashed var(--line-dark); background: #fbfcfd; text-align: center; }
    .upload-zone strong { font-family: var(--serif); font-size: 17px; font-weight: 600; }
    .upload-zone p { max-width: 50ch; }
    .file-record { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 12px; padding: 11px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .file-icon { display: grid; place-items: center; width: 28px; height: 34px; border: 1px solid var(--line-dark); color: var(--muted); font-family: var(--mono); font-size: 8px; }
    .file-record strong { display: block; font-size: 11px; }
    .file-record span { color: var(--muted); font-size: 9px; }
    .interview-card { margin-top: 14px; padding: 16px 0; border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); }
    .interview-card blockquote { margin: 0; font-family: var(--serif); font-size: 17px; line-height: 1.6; }
    .answer { margin: 14px 0 0 44px; padding: 11px 13px; background: var(--navy); color: #f6f7f9; font-size: 10px; line-height: 1.65; }
    .extracted-fact { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; margin-top: 13px; padding: 11px; border: 1px solid #b8dcca; background: var(--green-soft); }
    .extracted-fact span:first-child { color: var(--green); font-size: 9px; font-weight: 700; }
    .extracted-fact strong { display: block; font-size: 10px; }
    .extracted-fact p { margin: 3px 0 0; color: #50675e; font-size: 9px; }
    .choice-list { margin-top: 13px; border-top: 1px solid var(--line); }
    .choice-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--line); }
    .choice-row > span:first-child { color: var(--muted); font-size: 9px; }
    .choice-row strong { font-size: 11px; }
    .choice-row em { color: var(--muted); font-family: var(--mono); font-size: 8px; font-style: normal; }
    .readiness { margin-top: 14px; padding: 18px 0; border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); }
    .readiness strong { display: block; font-family: var(--serif); font-size: 22px; font-weight: 600; }
    .readiness p { max-width: 62ch; }
    .source-methods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .source-method { min-height: 86px; padding: 13px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); color: var(--ink); text-align: left; }
    .source-method:hover { background: var(--panel-soft); }
    .source-method span { display: block; color: var(--muted); font-family: var(--mono); font-size: 8px; }
    .source-method strong { display: block; margin-top: 14px; font-size: 11px; }
    .material-list { border-top: 1px solid var(--line); }
    .material-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .material-row.active { background: linear-gradient(90deg, var(--orange-soft), transparent 72%); }
    .material-row > span:first-child { color: var(--muted); font-size: 9px; }
    .material-row strong { display: block; font-size: 11px; }
    .material-row p { margin: 4px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .material-row time { color: var(--muted); font-family: var(--mono); font-size: 8px; }
    .parse-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .parse-field { min-height: 66px; padding: 11px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .parse-field span { display: block; color: var(--muted); font-size: 8px; }
    .parse-field strong { display: block; margin-top: 5px; font-size: 11px; }
    .object-preview { margin-top: 14px; padding: 18px 0; border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); }
    .object-preview h3 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 600; }
    .object-preview p { max-width: 62ch; }
    .context-footer { display: flex; justify-content: space-between; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .context-footer button { border: 0; background: transparent; color: var(--blue); font-family: var(--mono); font-size: 9px; }
    .artifact-scroll { min-height: 0; overflow: auto; }
    .artifact-document { max-width: 680px; padding: 28px 38px 48px; }
    .artifact-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .artifact-label strong { padding: 4px 7px; background: var(--navy); color: white; font-size: 9px; }
    .artifact-document h2 { margin: 18px 0 8px; font-family: var(--serif); font-size: 28px; line-height: 1.28; font-weight: 600; }
    .artifact-deck { margin: 0 0 20px; color: var(--muted); font-family: var(--serif); font-size: 13px; font-style: italic; line-height: 1.7; }
    .artifact-rule { margin: 20px 0 0; border: 0; border-top: 1px solid var(--line); }
    .artifact-section { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .artifact-section h3 { margin: 0 0 9px; font-family: var(--serif); font-size: 17px; font-weight: 600; }
    .artifact-section h3 span { margin-right: 9px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .artifact-section p { margin: 0 0 9px; color: #4e5763; font-size: 11px; line-height: 1.75; }
    .artifact-quote { margin: 12px 0 0; padding: 9px 12px; border-left: 2px solid var(--line-dark); background: #fafbfc; color: var(--muted); font-family: var(--serif); font-size: 11px; font-style: italic; line-height: 1.65; }
    .artifact-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 16px; }
    .artifact-summary div { padding: 9px 10px; border: 1px solid var(--line); border-radius: 5px; }
    .artifact-summary span { display: block; color: var(--muted); font-size: 9px; }
    .artifact-summary strong { display: block; margin-top: 4px; font-family: var(--serif); font-size: 14px; }
    .resume-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; padding-bottom: 16px; border-bottom: 1px solid var(--line-dark); }
    .resume-head h2 { margin: 0 0 4px; font-family: var(--sans); font-size: 22px; font-weight: 700; }

      }
      function collectPanel() {
        return `<div class="stage-block"><div class="stage-block-head"><h2>01 采集职位信息</h2><span>INPUT / USER PROVIDED</span></div><p>职位信息来自用户主动采集的 Boss 截图。择途只负责整理和建立后续调查上下文，不自动抓取或投递。</p><div class="source-row"><span class="source-kind">用户输入</span><span><strong>澄屿科技 · 资深前端工程师 / 前端负责人</strong><p>35-45K · 14薪 · 上海 · 工作方式待确认</p></span><time>09:36</time></div><div class="action-bar"><button class="action primary" data-step="survey">开始证据调查 →</button></div></div>`;
      }
      function decidePanel() {
        return `<div class="stage-block"><div class="stage-block-head"><h2>05 围绕决策包继续交互</h2><span>用户拥有最终决定权</span></div><p>成果保留在左侧，右侧从执行过程切换为顾问互动。顾问只围绕当前机会、证据和职业限制回答。</p><div class="prompt-row"><button class="prompt" data-toast="顾问将质疑当前建议（概念示例）">质疑当前建议</button><button class="prompt" data-toast="已生成招聘方确认问题（概念示例）">生成确认问题</button><button class="prompt" data-toast="将补充一条用户确认事实（概念示例）">补充事实</button></div><div class="dialogue"><div class="bubble user">如果只能先确认一件事，应该问什么？</div><div class="bubble">先问实际工作方式。它是你的硬约束，而且两个一手来源互相冲突；这个答案最可能改变是否值得继续投入。</div></div><div class="action-bar"><button class="action" data-toast="已保留：暂缓决定（概念示例）">暂缓决定</button><button class="action primary" data-toast="已记录：继续投入（概念示例）">继续投入</button></div></div>`;
      }
      function taskPanel() {
        let main = state.step === "collect" ? collectPanel() : state.step === "survey" ? surveyPanel() : state.step === "judge" ? judgePanel() : state.step === "prepare" ? preparePanel() : decidePanel();
        return `<section class="task-pane"><header class="task-head"><div><h1>澄屿科技 · 资深前端工程师</h1><p>当前机会持续贯穿采集、调查、判断、材料与决定</p></div><div><span>OPP_CHENGYU_01</span></div></header>${researchStageRail()}<div class="task-scroll">${main}${progressRows()}</div><footer class="activity-strip"><strong>最近变化</strong><p>工作方式冲突已提升为关键未知项，并同步到判断与申请材料。</p><time>10:08</time></footer></section>`;
      }
      function researchScreen() {
        return `<main class="workspace ${state.mode}">${artifactPane()}${taskPanel()}</main>`;
      }
      function render() {
        const content = state.space === "profile" ? profileScreen() : state.space === "library" ? libraryScreen() : researchScreen();
        $("app").innerHTML = `<div class="app">${topbar()}${content}</div>`;
        bind();
      }
      function bind() {
        document.querySelectorAll("[data-mode]").forEach((el) => el.addEventListener("click", () => { state.mode = el.dataset.mode; syncUrl(); render(); }));
        document.querySelectorAll("[data-space]").forEach((el) => el.addEventListener("click", () => { state.space = el.dataset.space; if (el.dataset.step) state.step = el.dataset.step; syncUrl(); render(); }));
        document.querySelectorAll("[data-step]").forEach((el) => el.addEventListener("click", () => { state.space = "research"; state.step = el.dataset.step; syncUrl(); render(); }));
        document.querySelectorAll("[data-profile-step]").forEach((el) => el.addEventListener("click", () => { state.space = "profile"; state.profileStep = el.dataset.profileStep; syncUrl(); render(); }));
        document.querySelectorAll("[data-library-step]").forEach((el) => el.addEventListener("click", () => { state.space = "library"; state.libraryStep = el.dataset.libraryStep; syncUrl(); render(); }));
        document.querySelectorAll("[data-toast]").forEach((el) => el.addEventListener("click", () => showToast(el.dataset.toast)));
      }
      render();
    })();
  </script>
</body>
</html>
