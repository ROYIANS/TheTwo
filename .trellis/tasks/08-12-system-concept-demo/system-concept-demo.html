<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>择途 · 系统概念 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f6f2;
      --surface: #fcfdf9;
      --ink: #17211b;
      --muted: #68736c;
      --line: #d3d9d3;
      --line-strong: #a8b2aa;
      --green: #14604a;
      --green-2: #1f7a5f;
      --green-soft: #dfede6;
      --blue: #315e86;
      --blue-soft: #e3ebf3;
      --copper: #98612e;
      --copper-soft: #f0e4d6;
      --red: #9d423b;
      --red-soft: #f3e2df;
      --amber: #89610c;
      --amber-soft: #f3ead5;
      --purple: #745884;
      --purple-soft: #ece6f0;
      --nav: 15rem;
      --aside: 19rem;
      --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --serif: Georgia, "Noto Serif CJK SC", "Songti SC", serif;
      font-family: var(--sans);
      font-size: 16px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body { margin: 0; color: var(--ink); letter-spacing: 0; }
    button, input { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--blue) 32%, transparent);
      outline-offset: 2px;
    }

    .prototype-note {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      min-height: 2rem;
      padding: 0.4rem 1rem;
      border-bottom: 1px solid #d6bd8d;
      background: var(--amber-soft);
      color: #5e430f;
      font-size: 0.68rem;
      font-weight: 700;
    }

    #app { min-height: calc(100vh - 2rem); }

    .brand-lockup { display: flex; align-items: center; gap: 0.7rem; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 2.15rem;
      height: 2.15rem;
      background: var(--ink);
      color: var(--surface);
      font-family: var(--serif);
      font-weight: 700;
    }
    .brand-cn { display: block; font-family: var(--serif); font-size: 1.08rem; font-weight: 700; }
    .brand-en { display: block; margin-top: 0.05rem; color: var(--muted); font-size: 0.58rem; font-weight: 800; }

    .icon {
      width: 1rem;
      height: 1rem;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge, .status, .source-tag, .fact-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      min-height: 1.55rem;
      padding: 0.26rem 0.48rem;
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .status.good, .fact-tag.fact { border-color: #9fc6b4; background: var(--green-soft); color: var(--green); }
    .status.caution, .fact-tag.unknown { border-color: #d2b879; background: var(--amber-soft); color: var(--amber); }
    .status.stop, .fact-tag.risk { border-color: #d3a19c; background: var(--red-soft); color: var(--red); }
    .status.wait, .source-tag { border-color: #aac0d3; background: var(--blue-soft); color: var(--blue); }
    .fact-tag.inference { border-color: #c7b6d0; background: var(--purple-soft); color: var(--purple); }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.35rem;
      padding: 0.48rem 0.75rem;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 800;
    }
    .button:hover { background: #ecefea; }
    .button.primary { border-color: var(--green); background: var(--green); color: white; }
    .button.primary:hover { background: #0e503d; }
    .button.ghost { border-color: transparent; color: var(--muted); }

    .page-title { margin: 0; font-family: var(--serif); font-size: clamp(1.7rem, 3vw, 2.55rem); line-height: 1.16; font-weight: 600; }
    .page-subtitle { max-width: 50rem; margin: 0.55rem 0 0; color: var(--muted); font-size: 0.84rem; line-height: 1.65; }
    .section-title { margin: 0; font-size: 0.86rem; font-weight: 800; }
    .section-note { color: var(--muted); font-size: 0.68rem; }

    .empty-line { color: var(--muted); font-size: 0.74rem; }

    .variant-switcher {
      position: fixed;
      left: 50%;
      bottom: 1rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem;
      border: 1px solid #424944;
      border-radius: 5px;
      background: #17201b;
      color: #f7f8f4;
      box-shadow: 0 0.75rem 2rem rgb(23 32 27 / 22%);
      transform: translateX(-50%);
    }
    .variant-switcher button {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: inherit;
      font-size: 1rem;
    }
    .variant-switcher button:hover { background: #303a33; }
    .variant-label { min-width: 11rem; padding: 0 0.45rem; text-align: center; font-size: 0.68rem; font-weight: 800; }

    .mobile-nav-button { display: none; }
    .mobile-scrim { display: none; }

    /* Variant A: Decision workspace */
    .a-shell { display: grid; grid-template-columns: var(--nav) minmax(0, 1fr) var(--aside); min-height: calc(100vh - 2rem); background: var(--paper); }
    .a-sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: calc(100vh - 2rem);
      border-right: 1px solid var(--line);
      background: #eef1ed;
      overflow-y: auto;
    }
    .a-brand { padding: 1.15rem; border-bottom: 1px solid var(--line); }
    .a-direction {
      margin: 0.9rem 0.75rem;
      padding: 0.8rem;
      border: 1px solid #b7c8bd;
      background: #f8faf7;
    }
    .a-direction span { display: block; color: var(--muted); font-size: 0.62rem; font-weight: 800; }
    .a-direction strong { display: block; margin-top: 0.28rem; font-size: 0.76rem; line-height: 1.45; }
    .a-nav { padding: 0.3rem 0.55rem; }
    .a-nav-group { margin: 1rem 0 0.35rem; padding: 0 0.55rem; color: var(--muted); font-size: 0.58rem; font-weight: 800; text-transform: uppercase; }
    .a-nav-button {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      min-height: 2.65rem;
      padding: 0.65rem 0.7rem;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #445048;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .a-nav-button:hover { background: #e2e7e2; }
    .a-nav-button.active { background: var(--ink); color: white; }
    .a-nav-count { margin-left: auto; font-size: 0.6rem; opacity: 0.72; }
    .a-user { margin-top: 1.2rem; padding: 1rem 1.15rem; border-top: 1px solid var(--line); font-size: 0.7rem; }
    .a-user strong, .a-user span { display: block; }
    .a-user span { margin-top: 0.2rem; color: var(--muted); }

    .a-main { min-width: 0; padding: 1.25rem clamp(1.2rem, 2.3vw, 2.5rem) 5rem; }
    .a-topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 2.7rem; margin-bottom: 1.5rem; }
    .a-crumb { color: var(--muted); font-size: 0.68rem; }
    .a-top-actions { display: flex; gap: 0.5rem; }
    .a-content { width: min(100%, 74rem); margin: 0 auto; }
    .a-page-header { display: flex; align-items: end; justify-content: space-between; gap: 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--line-strong); }
    .a-header-actions { display: flex; flex: 0 0 auto; gap: 0.5rem; }

    .a-ai {
      position: sticky;
      top: 0;
      align-self: start;
      height: calc(100vh - 2rem);
      border-left: 1px solid var(--line);
      background: var(--surface);
      overflow-y: auto;
    }
    .a-ai-head { padding: 1.1rem; border-bottom: 1px solid var(--line-strong); }
    .a-ai-head span { display: block; color: var(--green); font-size: 0.62rem; font-weight: 800; }
    .a-ai-head h2 { margin: 0.35rem 0 0; font-family: var(--serif); font-size: 1.1rem; }
    .a-ai-context { padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--line); background: #f1f4ef; }
    .a-ai-context span { display: block; color: var(--muted); font-size: 0.6rem; font-weight: 800; }
    .a-ai-context strong { display: block; margin-top: 0.3rem; font-size: 0.75rem; }
    .a-ai-body { padding: 1rem 1.1rem 5rem; }
    .a-ai-message { margin: 0; font-family: var(--serif); font-size: 0.9rem; line-height: 1.72; }
    .a-ai-list { margin: 1rem 0 0; padding: 0; list-style: none; }
    .a-ai-list li { padding: 0.72rem 0; border-top: 1px solid var(--line); font-size: 0.7rem; line-height: 1.55; }
    .a-ai-list strong { display: block; margin-bottom: 0.15rem; font-size: 0.65rem; }

    .today-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(17rem, 0.65fr); gap: 1.4rem; margin-top: 1.4rem; align-items: start; }
    .priority-list { border-top: 2px solid var(--ink); background: var(--surface); }
    .priority-head, .section-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3rem; padding: 0.75rem 0.95rem; border-bottom: 1px solid var(--line); }
    .priority-item {
      display: grid;
      grid-template-columns: 1.9rem minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: start;
      padding: 1rem 0.95rem;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .priority-item:hover { background: #f2f5f1; }
    .priority-index { display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--muted); font-size: 0.7rem; font-weight: 800; }
    .priority-item:first-of-type .priority-index { border-color: var(--green); background: var(--green); color: white; }
    .priority-title { display: block; font-size: 0.79rem; font-weight: 800; }
    .priority-copy { display: block; margin-top: 0.25rem; color: var(--muted); font-size: 0.7rem; line-height: 1.5; }
    .priority-action { color: var(--green); font-size: 0.67rem; font-weight: 800; white-space: nowrap; }

    .direction-pulse { border-top: 2px solid var(--green); background: var(--surface); }
    .pulse-body { padding: 1rem; }
    .pulse-title { font-family: var(--serif); font-size: 1.18rem; line-height: 1.4; }
    .pulse-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
    .pulse-rule { margin: 1rem 0; border: 0; border-top: 1px solid var(--line); }
    .pulse-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.45rem 0; font-size: 0.7rem; }
    .pulse-row span { color: var(--muted); }

    .opportunity-strip { margin-top: 1.4rem; border-top: 2px solid var(--blue); background: var(--surface); }
    .opportunity-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .opportunity-card { min-width: 0; padding: 1rem; border-right: 1px solid var(--line); cursor: pointer; }
    .opportunity-card:last-child { border-right: 0; }
    .opportunity-card:hover { background: #f1f4f1; }
    .opp-company { color: var(--muted); font-size: 0.65rem; }
    .opp-role { display: block; margin-top: 0.28rem; font-size: 0.78rem; font-weight: 800; line-height: 1.45; }
    .opp-meta { margin-top: 0.6rem; color: var(--muted); font-size: 0.66rem; line-height: 1.5; }
    .opp-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.75rem; }
    .opp-unknown { color: var(--muted); font-size: 0.62rem; }

    .object-table { margin-top: 1.4rem; border-top: 2px solid var(--ink); background: var(--surface); }
    .table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--line); }
    .table-filters { display: flex; gap: 0.35rem; }
    .filter-button { min-height: 1.9rem; padding: 0.35rem 0.55rem; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--muted); font-size: 0.64rem; font-weight: 700; }
    .filter-button.active { border-color: var(--ink); background: var(--ink); color: white; }
    .opportunity-row { display: grid; grid-template-columns: minmax(12rem, 1.3fr) minmax(7rem, 0.7fr) minmax(10rem, 1fr) 7rem 5rem; gap: 0.75rem; align-items: center; min-height: 4.25rem; padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--line); cursor: pointer; }
    .opportunity-row:hover { background: #f1f4f1; }
    .row-title strong { display: block; font-size: 0.76rem; }
    .row-title span, .row-cell { color: var(--muted); font-size: 0.67rem; line-height: 1.45; }

    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(18rem, 0.8fr); gap: 1.4rem; margin-top: 1.4rem; align-items: start; }
    .detail-main, .detail-side { min-width: 0; }
    .verdict-band { padding: 1.1rem; border-top: 3px solid var(--amber); background: var(--surface); }
    .verdict-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .verdict-title { font-family: var(--serif); font-size: 1.25rem; }
    .verdict-copy { margin: 0.65rem 0 0; color: #4f5a53; font-size: 0.76rem; line-height: 1.65; }
    .evidence-ledger { margin-top: 1rem; border-top: 2px solid var(--ink); background: var(--surface); }
    .evidence-item { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr) 5.8rem; gap: 0.8rem; padding: 0.85rem 0.95rem; border-bottom: 1px solid var(--line); }
    .evidence-kind { color: var(--muted); font-size: 0.64rem; font-weight: 800; }
    .evidence-text strong { display: block; font-size: 0.73rem; }
    .evidence-text span { display: block; margin-top: 0.22rem; color: var(--muted); font-size: 0.66rem; line-height: 1.5; }
    .evidence-time { color: var(--muted); font-size: 0.62rem; text-align: right; }
    .analysis-sheet { border-top: 2px solid var(--blue); background: var(--surface); }
    .analysis-block { padding: 0.9rem; border-bottom: 1px solid var(--line); }
    .analysis-block h3 { margin: 0; font-size: 0.7rem; }
    .analysis-block p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.68rem; line-height: 1.55; }
    .unknown-box { margin-top: 1rem; padding: 0.9rem; border: 1px solid #d6bd80; background: var(--amber-soft); }
    .unknown-box h3 { margin: 0; font-size: 0.7rem; }
    .unknown-box ul { margin: 0.55rem 0 0; padding-left: 1rem; font-size: 0.67rem; line-height: 1.55; }
    .detail-tabs { display: flex; gap: 0; margin-top: 1rem; border-bottom: 1px solid var(--line-strong); }
    .detail-tab { min-height: 2.45rem; padding: 0.5rem 0.75rem; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 0.68rem; font-weight: 800; }
    .detail-tab.active { border-bottom-color: var(--green); color: var(--green); }

    .profile-layout { display: grid; grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.25fr); gap: 1.4rem; margin-top: 1.4rem; align-items: start; }
    .profile-summary { border-top: 3px solid var(--green); background: var(--surface); }
    .profile-identity { padding: 1.15rem; border-bottom: 1px solid var(--line); }
    .profile-identity h2 { margin: 0; font-family: var(--serif); font-size: 1.35rem; }
    .profile-identity p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.72rem; line-height: 1.55; }
    .profile-stat { display: grid; grid-template-columns: 1fr auto; gap: 1rem; padding: 0.7rem 1rem; border-bottom: 1px solid var(--line); font-size: 0.7rem; }
    .profile-stat span { color: var(--muted); }
    .fact-board { border-top: 2px solid var(--ink); background: var(--surface); }
    .fact-group { padding: 1rem; border-bottom: 1px solid var(--line); }
    .fact-group h3 { margin: 0 0 0.65rem; font-size: 0.72rem; }
    .fact-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .timeline { margin-top: 1rem; border-top: 2px solid var(--copper); background: var(--surface); }
    .timeline-item { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: 1rem; padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); }
    .timeline-time { color: var(--muted); font-size: 0.65rem; }
    .timeline-copy strong { display: block; font-size: 0.72rem; }
    .timeline-copy span { display: block; margin-top: 0.25rem; color: var(--muted); font-size: 0.66rem; line-height: 1.5; }

    .materials-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-top: 1.4rem; }
    .material-item { min-width: 0; border-top: 3px solid var(--ink); background: var(--surface); }
    .material-item.job-specific { border-top-color: var(--green); }
    .material-head { padding: 0.9rem; border-bottom: 1px solid var(--line); }
    .material-head span { color: var(--muted); font-size: 0.62rem; }
    .material-head h2 { margin: 0.3rem 0 0; font-size: 0.82rem; }
    .material-body { padding: 0.9rem; }
    .material-row { display: flex; justify-content: space-between; gap: 0.75rem; padding: 0.45rem 0; border-bottom: 1px solid var(--line); font-size: 0.67rem; }
    .material-row span { color: var(--muted); }
    .material-actions { display: flex; gap: 0.45rem; margin-top: 0.8rem; }
    .package-review { margin-top: 1.2rem; border-top: 2px solid var(--blue); background: var(--surface); }
    .review-row { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: 0.65rem; align-items: start; padding: 0.8rem 0.9rem; border-bottom: 1px solid var(--line); }
    .review-check { display: grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--green); color: white; font-size: 0.65rem; }
    .review-copy strong { display: block; font-size: 0.7rem; }
    .review-copy span { display: block; margin-top: 0.2rem; color: var(--muted); font-size: 0.64rem; line-height: 1.45; }

    /* Variant B: Editorial career briefing */
    .b-shell { min-height: calc(100vh - 2rem); background: #f6f3ed; }
    .b-header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid #bcb8ae; background: rgb(249 247 242 / 96%); }
    .b-header-inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2rem; width: min(100% - 2rem, 86rem); min-height: 4.3rem; margin: 0 auto; }
    .b-nav { display: flex; justify-content: center; gap: 0.2rem; }
    .b-nav-button { min-height: 2.25rem; padding: 0.45rem 0.65rem; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #635f57; font-size: 0.68rem; font-weight: 800; }
    .b-nav-button.active { border-bottom-color: var(--copper); color: var(--ink); }
    .b-profile-button { display: flex; align-items: center; gap: 0.55rem; border: 0; background: transparent; color: var(--ink); font-size: 0.68rem; font-weight: 700; }
    .b-avatar { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--ink); color: white; font-family: var(--serif); }
    .b-main { width: min(100% - 2rem, 78rem); margin: 0 auto; padding: 2.4rem 0 6rem; }
    .b-date { color: var(--copper); font-size: 0.66rem; font-weight: 800; text-transform: uppercase; }
    .b-title { max-width: 52rem; margin: 0.65rem 0 0; font-family: var(--serif); font-size: clamp(2.25rem, 5vw, 4.6rem); font-weight: 500; line-height: 1.06; }
    .b-deck { max-width: 46rem; margin: 1rem 0 0; color: #625f58; font-family: var(--serif); font-size: 1rem; line-height: 1.7; }
    .b-rule { margin: 2rem 0 0; border: 0; border-top: 1px solid #8d897f; }
    .b-brief-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(17rem, 0.5fr); gap: 3rem; margin-top: 1.5rem; }
    .b-lead { min-width: 0; }
    .b-lead-label { color: var(--copper); font-size: 0.66rem; font-weight: 800; }
    .b-lead h2 { margin: 0.5rem 0 0; font-family: var(--serif); font-size: clamp(1.45rem, 3vw, 2.25rem); font-weight: 500; line-height: 1.2; }
    .b-lead p { margin: 0.8rem 0 0; color: #5f5c55; font-size: 0.82rem; line-height: 1.75; }
    .b-brief-action { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1rem; border: 0; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 0.72rem; font-weight: 800; }
    .b-sidebar-brief { border-top: 3px solid var(--ink); }
    .b-side-item { padding: 0.9rem 0; border-bottom: 1px solid #c8c4ba; }
    .b-side-item span { color: var(--copper); font-size: 0.62rem; font-weight: 800; }
    .b-side-item strong { display: block; margin-top: 0.3rem; font-family: var(--serif); font-size: 0.92rem; line-height: 1.4; }
    .b-section { margin-top: 3.2rem; }
    .b-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-bottom: 0.65rem; border-bottom: 1px solid #8d897f; }
    .b-section-head h2 { margin: 0; font-family: var(--serif); font-size: 1.25rem; font-weight: 500; }
    .b-section-head span { color: #767168; font-size: 0.65rem; }

    /* Variant D: Career decision research desk */

    }
    .d-topbar {
      position: sticky;

      display: grid;
      grid-template-columns: minmax(9rem, 1fr) auto minmax(12rem, 1fr);

      min-height: 2rem;

    .d-report { max-width: 53rem; margin: 0 auto; padding: clamp(1.7rem, 3.2vw, 3.1rem) clamp(1.4rem, 4.2vw, 4.3rem) 5rem; }
    .d-report-label { display: flex; align-items: center; gap: 0.65rem; color: #969c97; font-size: 0.58rem; }

    .d-deck { max-width: 43rem; margin: 0.8rem 0 0; color: #797f7a; font-family: var(--serif); font-size: 0.9rem; font-style: italic; line-height: 1.75; }

    .d-quote { margin: 1rem 0 0 2.85rem; padding: 0.65rem 0 0.65rem 0.85rem; border-left: 2px solid var(--d-line); color: #747b76; font-family: var(--serif); font-size: 0.72rem; font-style: italic; line-height: 1.7; }
    .d-inline-action { display: inline-flex; align-items: center; gap: 0.4rem; margin: 1rem 0 0 2.85rem; border: 0; border-bottom: 1px solid var(--d-ink); background: transparent; color: var(--d-ink); font-size: 0.67rem; font-weight: 800; }
    .d-report-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 1.3rem; border-top: 1px solid var(--d-line); border-bottom: 1px solid var(--d-line); }

    .d-report-fact strong { display: block; margin-top: 0.3rem; font-size: 0.73rem; line-height: 1.4; }

    .d-right-top { padding: 0.9rem 1rem 1rem; border-bottom: 1px solid var(--d-line); }

    .d-progress-code { color: #9ba19c; font-variant-numeric: tabular-nums; }
    .d-progress-row strong { font-family: var(--serif); font-weight: 600; }
    .d-progress-state { color: var(--d-muted); font-size: 0.56rem; }
    .d-primary-run {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      width: 100%;
      min-height: 2.8rem;
      margin-top: 0.75rem;
      border: 1px solid #222824;

      background-color: #222824;

      color: #f4f6f3;
      font-size: 0.66rem;
      font-weight: 800;

    .d-right-body { padding: 0.9rem 1rem 5rem; }

    .d-tool-head span { color: var(--d-muted); font-size: 0.58rem; }

      min-width: 0;

      border-bottom: 1px solid var(--d-line);

    .d-activity { margin-top: 0.9rem; border-top: 1px solid var(--d-line-strong); }
    .d-activity-head { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; color: var(--d-muted); font-size: 0.58rem; }
    .d-activity-item { display: grid; grid-template-columns: 0.8rem minmax(0, 1fr) auto; gap: 0.6rem; padding: 0.75rem 0; border-top: 1px solid var(--d-line); }

    .d-chat { margin-top: 1rem; border-top: 1px solid var(--d-line-strong); }

<body>

  <script>

        profile: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',

      const variants = {

      const navItems = [

      const opportunities = [
        { id: "chengyu", company: "澄屿科技", role: "资深前端工程师 / 前端负责人", salary: "35-45K · 14薪", place: "上海 · 工作方式待确认", recommendation: "谨慎投入", tone: "caution", unknowns: 3, match: "技术领导与架构职责匹配", next: "确认工作方式与长期招聘原因" },
        { id: "shore", company: "岸线云", role: "高级前端工程师", salary: "32-40K · 15薪", place: "上海 · 双休", recommendation: "值得投入", tone: "good", unknowns: 1, match: "平台工程经验高度相关", next: "审核职位定制简历" },
        { id: "prism", company: "折光智能", role: "前端架构师", salary: "40-55K · 13薪", place: "杭州 · 每周两天远程", recommendation: "等待信息", tone: "wait", unknowns: 5, match: "职责空间大，业务稳定性未知", next: "确认融资与团队规模" },

      const evidence = [
        { kind: "一手来源", title: "公司官网能够核验产品与主体", note: "官网披露核心产品面向零售数字化，工商主体与招聘主体名称一致。", time: "今天 09:42" },

      const appState = {

        const side = `${dProgress([["done","01","解析职位与公司主体","Completed"],["done","02","检索公开证据","4 sources"],["done","03","比对职业事实与限制","27 facts"],["active","04","等待关键未知项确认","3 questions"]],"准备招聘方确认问题")}<div class="d-tool-head" style="margin-top:1rem"><div><h2>证据轨迹</h2><span>来源强度与冲突保持可见</span></div></div><div class="d-dossier">${evidence.map(e=>`<div class="d-dossier-row"><span>${e.kind}</span><strong>${e.title}<br><small style="color:#7b827d;font-weight:400">${e.note}</small></strong><em>${e.time}</em></div>`).join("")}</div><div class="d-chat"><div class="d-tool-head"><div><h2>与机会顾问对话</h2><span>上下文：澄屿科技 · 当前判断</span></div></div><div class="d-chat-message user">如果只能先问招聘方一个问题，应该问什么？</div><div class="d-chat-message">先确认实际工作方式。它是你的硬条件，而且公开来源互相冲突；答案会直接决定是否值得继续投入。</div><div class="d-chat-input"><input aria-label="向机会顾问提问" placeholder="围绕这个机会继续追问…"><button class="d-icon-button dark" type="button">发送</button></div></div>`;
        return [report, side, `<div class="d-trace-head"><span>decision provenance</span><span>opp_chengyu_01</span></div><div><strong>FACT</strong> 产品与招聘主体可核验</div><div><strong>INFERENCE</strong> 长期招聘可能与扩招或留存有关，尚不可下结论</div><div><strong>VALUE</strong> 工作方式属于用户硬约束，优先于一般技术匹配</div>`];
      }

      function profileContentD() {
        const rows = [["经历","8 年前端与全栈经历","已确认"],["能力","主导前端工程化升级","已确认"],["项目","设计微前端迁移路径并推动三个业务线落地","已确认"],["职责","技术负责人，不承担人员绩效","用户更正"],["AI 推断","可能参与过技术招聘评估","待确认"],["未知项","工程化改造的完整量化影响","待补充"]];
        const report = `${dReportIntro("CAREER FACT FILE", "林舟的职业画像，是一份可以被质疑和更正的事实档案", "AI 可以主动提出理解，但只有用户确认的事实才能参与机会判断、简历表达与长期职业规划。", [["已确认事实","27"],["能力证据","18"],["待确认推断","2"]])}<div class="d-dossier">${rows.map(([type,value,state])=>`<div class="d-dossier-row"><span>${type}</span><strong>${value}</strong><em>${state}</em></div>`).join("")}</div>${dSection(1,"最近一次更正","用户否定了“人员管理者”推断，确认自己的领导方式是技术方案、架构决策与跨团队协作。该更正已经同步影响三个机会判断和两份材料。",{state:"已传播",tone:"good",quote:"更正历史用于解释系统为何改变判断，不用于重新施加用户已经否定的标签。"})}`;
        const side = `${dProgress([["done","01","整理经历与项目证据","18 sources"],["done","02","提出职业事实与推断","29 items"],["active","03","等待用户解释权确认","2 inferences"]],"校准待确认职业推断")}<div class="d-tool-head" style="margin-top:1rem"><div><h2>待用户确认</h2><span>不会进入对外材料</span></div></div>${dActivity([["","是否参与技术招聘评估","来自“参与团队建设”的模糊表述，证据不足。","待确认"],["","是否具备平台团队协作经验","多个项目存在共享能力建设，但团队归属仍未知。","待确认"],["good","人员管理者推断已撤回","用户明确不承担绩效与人员管理。","08:55"]])}<div class="d-chat"><div class="d-chat-message user">我负责过面试题设计和技术面试，但不负责招聘决策。</div><div class="d-chat-message">这足以确认“参与技术招聘评估”，但不能扩展为“负责团队招聘”。我会保留这个边界。</div><div class="d-chat-input"><input aria-label="更正职业画像" placeholder="补充或纠正这条理解…"><button class="d-icon-button dark" type="button">确认</button></div></div>`;
        return [report, side, `<div class="d-trace-head"><span>profile propagation</span><span>profile_lz_27</span></div><div><strong>08:55</strong> removed inference: people_manager</div><div><strong>08:56</strong> updated 3 opportunity matches</div><div><strong>08:57</strong> updated 2 material expressions</div>`];
      }

      function materialsContentD() {
        const report = `${dReportIntro("APPLICATION DOSSIER", "岸线云 · 高级前端工程师申请材料", "职位定制不是重新发明一段职业经历，而是基于同一事实源，选择更适合当前岗位理解顺序的表达。", [["相对基础版","4 处修改"],["新增事实","0"],["当前状态","等待审核"]])}<div class="d-material-page">
          <div class="d-material-block"><h2>职业摘要</h2><p>8 年前端与全栈经验，长期聚焦复杂业务系统、工程化与跨团队技术落地。曾<span class="d-change">主导前端工程化升级，并推动共享能力在三个业务线落地</span>。</p></div>
          <div class="d-material-block"><h2>核心经历 · 星海互联</h2><h3>前端架构师 / 技术负责人</h3><p><span class="d-change">设计微前端迁移路径，协调三个业务线分阶段接入，降低存量系统一次性改造风险。</span>负责方案评审、公共能力建设和关键问题治理，不承担人员绩效管理。</p></div>
          <div class="d-material-block"><h2>表达边界</h2><p>没有把“跨团队方案推动”写成“团队管理”；没有补写无法核验的性能收益；招聘参与仍只作为待确认画像推断，不进入本材料。</p></div>
        </div>`;
        const side = `${dProgress([["done","01","读取职位职责","Completed"],["done","02","选择相关职业事实","11 facts"],["done","03","生成有依据的改写","4 changes"],["active","04","等待用户审核","Review"]],"开始逐项审核")}${dActivity([["good","平台工程经验提前","岗位强调共享能力建设，因此调整到第一页。","修改 01"],["good","微前端项目表述具体化","保留三个业务线落地事实，没有补写不可核验收益。","修改 02"],["risk","人员管理表述被阻止","职业画像已明确不承担人员绩效，材料不得暗示管理职责。","边界"]])}<div class="d-chat"><div class="d-chat-message user">这份材料是不是太强调工程化，弱化了业务结果？</div><div class="d-chat-message">是。当前版本适合岸线云的平台岗位，但可以补充一个经过确认的业务结果。现有事实源里还缺少可靠量化数据，我不会替你编造。</div><div class="d-chat-input"><input aria-label="审核材料修改" placeholder="对当前修改提出意见…"><button class="d-icon-button dark" type="button">发送</button></div></div>`;
        return [report, side, `<div class="d-trace-head"><span>material audit</span><span>pack_shore_02</span></div><div><strong>PASS</strong> all expressions trace to confirmed career facts</div><div><strong>BLOCK</strong> unverified quantitative outcome excluded</div><div><strong>WAIT</strong> user decision on emphasis and final wording</div>`];
      }

      function renderD() {
        const [report, side, trace] = appState.page === "today" ? todayContentD() : appState.page === "opportunities" ? opportunitiesContentD() : appState.page === "opportunity" ? opportunityContentD() : appState.page === "profile" ? profileContentD() : materialsContentD();
        return `<div class="d-shell">${dTopbar()}<div class="d-workspace"><section class="d-left">${dPaneHead("left")}<article class="d-report">${report}</article></section><section class="d-right">${dPaneHead("right")}<div class="d-right-top">${side.split('<div class="d-tool-head"')[0]}</div><div class="d-right-body">${side.includes('<div class="d-tool-head"') ? '<div class="d-tool-head"' + side.split('<div class="d-tool-head"').slice(1).join('<div class="d-tool-head"') : ""}</div></section><footer class="d-trace">${trace}</footer></div></div>`;
      }

      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("variant", appState.variant);
        history.replaceState(null, "", url);
      }

      function cycleVariant(delta) {
        const keys = Object.keys(variants);
        const current = keys.indexOf(appState.variant);
        appState.variant = keys[(current + delta + keys.length) % keys.length];
        appState.navOpen = false;
        updateUrl();
        render();
      }

      function navigate(page) {
        appState.page = page;
        appState.navOpen = false;
        render();
      }

      function bindEvents() {
        document.querySelectorAll("[data-page]").forEach(el => el.addEventListener("click", () => navigate(el.dataset.page)));
        document.querySelectorAll("[data-opportunity]").forEach(el => el.addEventListener("click", () => navigate("opportunity")));
        document.querySelectorAll("[data-detail-tab]").forEach(el => el.addEventListener("click", () => { appState.detailTab = el.dataset.detailTab; render(); }));
        document.querySelectorAll("[data-nav-toggle]").forEach(el => el.addEventListener("click", () => { appState.navOpen = true; render(); }));
      }

      function setNavOpen(open) {
        appState.navOpen = open;
        const nav = document.getElementById("mobile-nav");
        if (nav) nav.classList.toggle("open", open);
        $("mobile-scrim").hidden = !open;
      }

      function render() {
        $("app").innerHTML = appState.variant === "A" ? renderA() : appState.variant === "B" ? renderB() : appState.variant === "C" ? renderC() : renderD();
        $("variant-label").textContent = variants[appState.variant];
        $("mobile-scrim").hidden = !appState.navOpen;
        bindEvents();
      }

      $("prev-variant").addEventListener("click", () => cycleVariant(-1));
      $("next-variant").addEventListener("click", () => cycleVariant(1));
      $("mobile-scrim").addEventListener("click", () => setNavOpen(false));
      document.addEventListener("keydown", (event) => {
        const tag = document.activeElement?.tagName;
        if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
        if (event.key === "ArrowLeft") cycleVariant(-1);
        if (event.key === "ArrowRight") cycleVariant(1);
        if (event.key === "Escape") setNavOpen(false);
      });

      render();
    })();
  </script>
</body>
</html>
